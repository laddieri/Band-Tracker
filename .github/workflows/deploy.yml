name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The same syntax, static and unit-test checks as PRs. A deploy only goes
  # out if they pass on the exact commit being deployed.
  checks:
    uses: ./.github/workflows/syntax.yml

  deploy:
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      # Publish only what the app serves. Everything else in the repo (tests,
      # scripts, functions, docs, rules, package files, CLAUDE.md) stays off
      # the public site. A new top-level asset must be added here.
      - name: Stage site files
        run: |
          set -e
          mkdir _site
          cp -r index.html app.css sw.js firebase-config.js manifest.json CNAME .nojekyll icons js _site/
          # Everything index.html loads and sw.js precaches must be in _site.
          node tests/check-precache.js _site

      # Stamp the deploy time into the app (APP_BUILD) and the service worker
      # (BUILD). Changing sw.js is what makes open apps notice a new version,
      # and APP_BUILD stops out-of-date clients from overwriting the student
      # portal snapshot. Only the staged copy is changed, never the repo.
      - name: Stamp build number
        working-directory: _site
        run: |
          set -e
          BUILD=$(date +%s)
          sed -i "s/^const APP_BUILD = 0;$/const APP_BUILD = ${BUILD};/" js/01-core.js
          sed -i "s/^const BUILD = 0;$/const BUILD = ${BUILD};/" sw.js
          grep -q "^const APP_BUILD = ${BUILD};$" js/01-core.js
          grep -q "^const BUILD = ${BUILD};$" sw.js
          echo "Stamped build ${BUILD}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
