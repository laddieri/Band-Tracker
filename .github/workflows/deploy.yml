name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      # Stamp the deploy time into the app (APP_BUILD) and the service worker
      # (BUILD). Changing sw.js is what makes open apps notice a new version,
      # and APP_BUILD stops out-of-date clients from overwriting the student
      # portal snapshot. Only the uploaded copy is changed, never the repo.
      - name: Stamp build number
        run: |
          set -e
          BUILD=$(date +%s)
          sed -i "s/^const APP_BUILD = 0;$/const APP_BUILD = ${BUILD};/" js/01-core.js
          sed -i "s/^const BUILD = 0;$/const BUILD = ${BUILD};/" sw.js
          grep -q "^const APP_BUILD = ${BUILD};$" js/01-core.js
          grep -q "^const BUILD = ${BUILD};$" sw.js
          echo "Stamped build ${BUILD}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deploy
        uses: actions/deploy-pages@v4
